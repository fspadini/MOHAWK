[project]
name = "mohawk"
version = "0.1.0"
description = "Python/MNE reimplementation of the MOHAWK hdEEG brain-network pipeline (Chennu et al., 2017)"
readme = "PYTHON.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MOHAWK contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "mne>=1.6",
    "mne-connectivity>=0.5",
    "networkx>=3.0",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "defusedxml>=0.7",   # required by MNE to read EGI .mff recordings
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
mohawk = "mohawk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mohawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
