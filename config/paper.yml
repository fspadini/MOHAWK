# Paper-faithful settings for Chennu et al., Brain 2017 (+ supplement).
# Load with: mohawk.config.load_config("config/paper.yml")
preproc:
  resample_sfreq: 250.0
  hp_freq: 0.5
  lp_freq: 45.0
  line_freq: auto        # detect 50 vs 60 Hz mains from the data
  epoch_length: 10.0

spectrum:
  fmin: 0.5
  fmax: 45.0
  bandwidth: 0.6         # five Slepian tapers over 10 s epochs
  relative_power_nbands: 3   # relative power over delta/theta/alpha (0.5-13 Hz), paper definition

connectivity:
  fmin: 0.5
  fmax: 45.0
  bandwidth: 0.6

artifact:
  ica_method: infomax    # EEGLAB runica default used by MOHAWK
  ica_extended: true

graph:
  heuristic: 50          # Louvain repetitions

# Three canonical bands used by the paper's main analysis.
bands: [[0.0, 4.0], [4.0, 8.0], [8.0, 13.0]]
band_names: [delta, theta, alpha]

# Proportional connection densities: strongest 90% down to 10% in 2.5% steps.
densities: [0.900, 0.875, 0.850, 0.825, 0.800, 0.775, 0.750, 0.725, 0.700,
            0.675, 0.650, 0.625, 0.600, 0.575, 0.550, 0.525, 0.500, 0.475,
            0.450, 0.425, 0.400, 0.375, 0.350, 0.325, 0.300, 0.275, 0.250,
            0.225, 0.200, 0.175, 0.150, 0.125, 0.100]
